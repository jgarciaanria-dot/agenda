<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#faf6ee" />
<title>Asistente · Vicelly Sánchez Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --crema: #faf6ee;
    --crema-panel: #ffffff;
    --linea: #e9e2d3;
    --dorado: #b8862f;
    --dorado-suave: #f2e6cc;
    --tinta: #2b2620;
    --tinta-suave: #8a8072;
    --burbuja-usuario: #2b2620;
    --burbuja-usuario-texto: #faf6ee;
    --burbuja-agente: #f3efe4;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overscroll-behavior-y: none;
  }

  body {
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--crema);
    margin: 0;
    color: var(--tinta);
    height: 100dvh;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    background: var(--crema);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ---- Header ---- */
  .encabezado {
    flex: 0 0 auto;
    padding: calc(14px + var(--safe-top)) 20px 14px;
    background: var(--crema);
    border-bottom: 1px solid var(--linea);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .encabezado-titulo {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .encabezado-marca {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .encabezado-estado {
    font-size: 12.5px;
    color: var(--tinta-suave);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .punto-activo {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #5c9a6b;
    flex: none;
  }
  .boton-reiniciar {
    flex: none;
    font-size: 12.5px;
    font-weight: 500;
    padding: 8px 13px;
    border-radius: 20px;
    border: 1px solid var(--linea);
    background: var(--crema-panel);
    color: var(--tinta);
    cursor: pointer;
  }
  .boton-reiniciar:active { background: var(--dorado-suave); }

  /* ---- Mensajes ---- */
  .chat-mensajes {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .fila { display: flex; }
  .fila.usuario { justify-content: flex-end; }
  .fila.agente { justify-content: flex-start; }

  .msg {
    padding: 11px 14px;
    border-radius: 18px;
    max-width: 82%;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.usuario {
    background: var(--burbuja-usuario);
    color: var(--burbuja-usuario-texto);
    border-bottom-right-radius: 5px;
  }
  .msg.agente {
    background: var(--burbuja-agente);
    color: var(--tinta);
    border-bottom-left-radius: 5px;
  }
  .msg.error {
    background: #f6e3df;
    color: #8a3b2c;
  }

  .marca-lateral {
    font-size: 10.5px;
    color: var(--tinta-suave);
    margin: 4px 4px 0;
    letter-spacing: 0.02em;
  }
  .fila.agente .marca-lateral { text-align: left; }
  .fila.usuario + .marca-espaciador { display: none; }

  /* ---- Indicador de "escribiendo" ---- */
  .escribiendo {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 2px;
  }
  .escribiendo span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--tinta-suave);
    animation: rebote 1.1s infinite ease-in-out;
  }
  .escribiendo span:nth-child(2) { animation-delay: 0.15s; }
  .escribiendo span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes rebote {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---- Entrada ---- */
  .chat-input {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 14px calc(10px + var(--safe-bottom));
    background: var(--crema);
    border-top: 1px solid var(--linea);
  }
  .chat-input textarea {
    flex: 1;
    resize: none;
    max-height: 110px;
    padding: 11px 15px;
    border-radius: 20px;
    border: 1px solid var(--linea);
    background: var(--crema-panel);
    font-size: 15px;
    font-family: inherit;
    color: var(--tinta);
    line-height: 1.35;
  }
  .chat-input textarea:focus {
    outline: none;
    border-color: var(--dorado);
  }
  .chat-input textarea::placeholder { color: var(--tinta-suave); }

  .boton-enviar {
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--tinta);
    color: var(--crema);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .boton-enviar:disabled { background: var(--linea); color: var(--tinta-suave); }
  .boton-enviar svg { width: 18px; height: 18px; }

  .chat-mensajes::-webkit-scrollbar { width: 4px; }
  .chat-mensajes::-webkit-scrollbar-thumb { background: var(--linea); border-radius: 4px; }
</style>
</head>
<body>

<div class="app">
  <div class="encabezado">
    <div class="encabezado-titulo">
      <div class="encabezado-marca">Vicelly Sánchez Studio</div>
      <div class="encabezado-estado"><span class="punto-activo"></span>Asistente en línea</div>
    </div>
    <button class="boton-reiniciar" id="botonReiniciar" title="Empezar una conversación nueva">Nueva conversación</button>
  </div>

  <div class="chat-mensajes" id="mensajes"></div>

  <div class="chat-input">
    <textarea id="entrada" placeholder="Escribe tu mensaje..." rows="1"></textarea>
    <button class="boton-enviar" id="botonEnviar" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>

<script>
  const URL_AGENTE = "https://script.google.com/macros/s/AKfycbyWwK6GCUJ7Zy6wet057DPBWK7rwYmV3y9hO2kgDMS8cE9GTAuDQKhbnDkKQMObZtom/exec";

  const contenedorMensajes = document.getElementById("mensajes");
  const campoEntrada = document.getElementById("entrada");
  const botonEnviar = document.getElementById("botonEnviar");
  const botonReiniciar = document.getElementById("botonReiniciar");

  // Guarda la conversación completa en memoria del navegador.
  // Se reenvía completa con cada pregunta para que el agente recuerde el contexto (ej. confirmaciones).
  let historialConversacion = [];

  function agregarMensaje(texto, tipo) {
    const fila = document.createElement("div");
    fila.className = "fila " + (tipo === "usuario" ? "usuario" : "agente");

    const burbuja = document.createElement("div");
    burbuja.className = "msg " + tipo;
    burbuja.textContent = texto;

    fila.appendChild(burbuja);
    contenedorMensajes.appendChild(fila);
    contenedorMensajes.scrollTop = contenedorMensajes.scrollHeight;
    return fila;
  }

  function mostrarEscribiendo() {
    const fila = document.createElement("div");
    fila.className = "fila agente";
    fila.innerHTML = '<div class="msg agente escribiendo"><span></span><span></span><span></span></div>';
    contenedorMensajes.appendChild(fila);
    contenedorMensajes.scrollTop = contenedorMensajes.scrollHeight;
    return fila;
  }

  function ajustarAlturaEntrada() {
    campoEntrada.style.height = "auto";
    campoEntrada.style.height = Math.min(campoEntrada.scrollHeight, 110) + "px";
  }

  async function enviarPregunta() {
    const pregunta = campoEntrada.value.trim();
    if (!pregunta) return;

    agregarMensaje(pregunta, "usuario");
    campoEntrada.value = "";
    ajustarAlturaEntrada();
    botonEnviar.disabled = true;

    const filaEscribiendo = mostrarEscribiendo();

    try {
      const respuesta = await fetch(URL_AGENTE, {
        method: "POST",
        body: JSON.stringify({
          pregunta: pregunta,
          historial: historialConversacion
        })
      });
      const datos = await respuesta.json();

      filaEscribiendo.remove();

      if (datos.error) {
        agregarMensaje("Error: " + datos.error, "error");
      } else {
        agregarMensaje(datos.respuesta, "agente");
        historialConversacion = datos.historial || historialConversacion;
      }
    } catch (error) {
      filaEscribiendo.remove();
      agregarMensaje("No se pudo conectar con el agente. Revisa la URL o tu conexión.", "error");
    }

    botonEnviar.disabled = false;
    campoEntrada.focus();
  }

  function reiniciarConversacion() {
    historialConversacion = [];
    contenedorMensajes.innerHTML = "";
    agregarMensaje("Conversación reiniciada. ¿En qué puedo ayudarte?", "agente");
  }

  botonEnviar.addEventListener("click", enviarPregunta);
  campoEntrada.addEventListener("keydown", function(evento) {
    if (evento.key === "Enter" && !evento.shiftKey) {
      evento.preventDefault();
      enviarPregunta();
    }
  });
  campoEntrada.addEventListener("input", ajustarAlturaEntrada);
  botonReiniciar.addEventListener("click", reiniciarConversacion);

  reiniciarConversacion();
</script>

</body>
</html>
