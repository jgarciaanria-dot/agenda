<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agente de Vicelly Studio</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f1efe8;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .chat-container {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #ddd;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 80vh;
  }
  .chat-header {
    padding: 14px 16px;
    border-bottom: 1px solid #eee;
    font-weight: 600;
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chat-header button {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: white;
    cursor: pointer;
    color: #666;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    padding: 8px 12px;
    border-radius: 14px;
    max-width: 80%;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.usuario {
    align-self: flex-end;
    background: #d6e8fb;
    border-bottom-right-radius: 4px;
  }
  .msg.agente {
    align-self: flex-start;
    background: #f1f1f1;
    border-bottom-left-radius: 4px;
  }
  .msg.cargando {
    align-self: flex-start;
    color: #999;
    font-style: italic;
  }
  .chat-input {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid #eee;
  }
  .chat-input input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
  }
  .chat-input button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: #185fa5;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  .chat-input button:disabled {
    background: #aaa;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <span>Asistente de Vicelly Studio</span>
    <button id="botonReiniciar" title="Empezar una conversación nueva">Nueva conversación</button>
  </div>
  <div class="chat-messages" id="mensajes"></div>
  <div class="chat-input">
    <input type="text" id="entrada" placeholder="Escribe tu mensaje..." />
    <button id="botonEnviar">Enviar</button>
  </div>
</div>

<script>
  const URL_AGENTE = "https://script.google.com/macros/s/AKfycbzDS42slyoCGpelYLhWsXPHtOWDi5uWa2yHrreQlv8Pt9v1XdcVBoXjyHu4xzG9x1Q8/exec";

  const contenedorMensajes = document.getElementById("mensajes");
  const campoEntrada = document.getElementById("entrada");
  const botonEnviar = document.getElementById("botonEnviar");
  const botonReiniciar = document.getElementById("botonReiniciar");

  // Guarda la conversación completa en memoria del navegador.
  // Se reenvía completa con cada pregunta para que el agente recuerde el contexto (ej. confirmaciones).
  let historialConversacion = [];

  function agregarMensaje(texto, tipo) {
    const div = document.createElement("div");
    div.className = "msg " + tipo;
    div.textContent = texto;
    contenedorMensajes.appendChild(div);
    contenedorMensajes.scrollTop = contenedorMensajes.scrollHeight;
    return div;
  }

  async function enviarPregunta() {
    const pregunta = campoEntrada.value.trim();
    if (!pregunta) return;

    agregarMensaje(pregunta, "usuario");
    campoEntrada.value = "";
    botonEnviar.disabled = true;

    const mensajeCargando = agregarMensaje("Pensando...", "cargando");

    try {
      const respuesta = await fetch(URL_AGENTE, {
        method: "POST",
        body: JSON.stringify({
          pregunta: pregunta,
          historial: historialConversacion
        })
      });
      const datos = await respuesta.json();

      mensajeCargando.remove();

      if (datos.error) {
        agregarMensaje("Error: " + datos.error, "agente");
      } else {
        agregarMensaje(datos.respuesta, "agente");
        historialConversacion = datos.historial || historialConversacion;
      }
    } catch (error) {
      mensajeCargando.remove();
      agregarMensaje("No se pudo conectar con el agente. Revisa la URL o tu conexión.", "agente");
    }

    botonEnviar.disabled = false;
  }

  function reiniciarConversacion() {
    historialConversacion = [];
    contenedorMensajes.innerHTML = "";
    agregarMensaje("Conversación reiniciada. ¿En qué puedo ayudarte?", "agente");
  }

  botonEnviar.addEventListener("click", enviarPregunta);
  campoEntrada.addEventListener("keypress", function(evento) {
    if (evento.key === "Enter") enviarPregunta();
  });
  botonReiniciar.addEventListener("click", reiniciarConversacion);
</script>

</body>
</html>
